services:
  - type: web
    name: bgg-data-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # No env vars required - this runs open to anyone by default (see DEPLOY.md).
    # To restrict access later, add MCP_AUTH_TOKEN under this service's Environment
    # tab in the Render dashboard; no redeploy or render.yaml change needed.
